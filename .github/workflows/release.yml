name: Release

# Pushing a tag like v0.2.0 builds the signed APK and publishes it. The in-app updater and
# Obtainium both read the release this creates.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # The signing key lives in this environment, not at repository level.
    environment: release
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Check the tag matches versionName
        run: grep -q "versionName = \"${GITHUB_REF_NAME#v}\"" app/build.gradle.kts
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
      - run: ./gradlew testDebugUnitTest assembleRelease -PproxyUrl="$PROXY_URL"
        env:
          PROXY_URL: ${{ vars.PROXY_URL }}
      - run: mv app/build/outputs/apk/release/app-release.apk "wdiw-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: android-tv/wdiw-*.apk
          generate_release_notes: true
