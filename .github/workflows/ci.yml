name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a change in the build tools shows up before release day.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-and-registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: proxy/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate the provider registry
        run: pnpm run check:registry
      - run: pnpm run typecheck
      - run: pnpm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew testDebugUnitTest assembleRelease
      - name: Keep the APK small
        run: |
          size=$(stat -c %s app/build/outputs/apk/release/*.apk)
          echo "Release APK: $size bytes"
          test "$size" -lt 6000000
