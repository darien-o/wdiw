# One pull request per ecosystem per month for small updates, and one for major updates.
# Small updates merge themselves once CI passes (see workflows/dependabot-automerge.yml);
# major updates wait for a person.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /proxy
    schedule:
      interval: monthly
    groups:
      proxy-minor:
        update-types: [minor, patch]
      proxy-major:
        update-types: [major]

  - package-ecosystem: gradle
    directory: /android-tv
    schedule:
      interval: monthly
    groups:
      android-minor:
        update-types: [minor, patch]
      android-major:
        update-types: [major]
