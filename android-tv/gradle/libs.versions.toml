[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
activityCompose = "1.13.0"
datastore = "1.2.1"
palette = "1.0.0"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
coil = "3.6.3"
zxing = "3.5.4"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
palette = { module = "androidx.palette:palette-ktx", version.ref = "palette" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
