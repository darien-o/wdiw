org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# Base URL of the proxy the app talks to. Override per build with -PproxyUrl=...
# Debug builds default to a local `wrangler dev` as seen from the emulator.
proxyUrl.debug=http://10.0.2.2:8787
proxyUrl.release=https://wdiw-proxy.darien-cloudfare.workers.dev
# GitHub repository whose releases the in-app updater checks.
updateRepo=darien-o/wdiw
